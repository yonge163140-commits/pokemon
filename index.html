<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寶可夢英文大冒險 ⚡</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CC0000;--red2:#FF4444;--gold:#FFD700;
  --dark:#0d0d1a;--card:#181830;--card2:#20203c;
  --text:#f0f0ff;--muted:#7777aa;
  --correct:#00e676;--cbg:rgba(0,230,118,0.12);
  --wrong:#ff5252;--wbg:rgba(255,82,82,0.12);
  --blue:#2196f3;--purple:#9c27b0;
  --r:18px;--rs:11px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 45% at 15% 10%,rgba(204,0,0,0.13) 0%,transparent 65%),
  radial-gradient(ellipse 55% 40% at 85% 85%,rgba(255,215,0,0.09) 0%,transparent 60%);}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;background:rgba(255,255,255,0.8);border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s);}
@keyframes twinkle{0%,100%{opacity:0.1}50%{opacity:0.9}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
.cp{position:absolute;top:-20px;animation:cfall var(--dur,2s) ease-in var(--dl,0s) both;}
@keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(800deg);opacity:0}}
#app{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:1.2rem 0.85rem 3rem;}

/* LOADING */
#loading{text-align:center;padding:5rem 1rem;}
.pb-spin{width:72px;height:72px;border-radius:50%;background:linear-gradient(180deg,var(--red) 50%,#fff 50%);border:4px solid #333;margin:0 auto 1.5rem;position:relative;animation:pbspin 0.75s linear infinite;box-shadow:0 0 30px rgba(204,0,0,0.45);}
.pb-spin::before{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:#333;transform:translateY(-50%);}
.pb-spin::after{content:'';position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:white;border:4px solid #333;transform:translate(-50%,-50%);}
@keyframes pbspin{to{transform:rotate(360deg)}}
.ld-title{font-family:'Fredoka One',cursive;font-size:22px;color:var(--gold);margin-bottom:0.4rem;}
.ld-sub{font-size:13px;color:var(--muted);font-weight:700;}

/* START */
#start{text-align:center;display:none;}
.logo-pb{width:88px;height:88px;border-radius:50%;background:linear-gradient(180deg,var(--red) 50%,#fff 50%);border:4px solid #444;margin:0 auto 1rem;position:relative;animation:float 3.5s ease-in-out infinite;box-shadow:0 0 28px rgba(204,0,0,0.4);}
.logo-pb::before{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:#444;transform:translateY(-50%);}
.logo-pb::after{content:'';position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:white;border:4px solid #444;transform:translate(-50%,-50%);}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
.title{font-family:'Fredoka One',cursive;font-size:32px;line-height:1.2;background:linear-gradient(135deg,var(--gold) 0%,var(--red2) 55%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.2rem;}
.subtitle{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:1.75rem;}
.chips{display:flex;justify-content:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:1.75rem;}
.chip{background:var(--card);border:1.5px solid rgba(255,215,0,0.15);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--muted);}
.chip b{color:var(--gold);}
.tr-label{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:0.65rem;}
.tr-row{display:flex;gap:0.65rem;justify-content:center;margin-bottom:1.75rem;}
.tr-btn{background:var(--card);border:2px solid rgba(255,255,255,0.07);border-radius:var(--r);padding:0.75rem 0.85rem;cursor:pointer;transition:all 0.2s;text-align:center;min-width:88px;font-family:'Nunito',sans-serif;}
.tr-btn:hover{border-color:rgba(255,215,0,0.5);transform:translateY(-3px);}
.tr-btn.sel{border-color:var(--gold);background:rgba(255,215,0,0.07);box-shadow:0 0 20px rgba(255,215,0,0.18);}
.tr-img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 4px;}
.tr-emoji{font-size:48px;display:block;line-height:1;margin-bottom:4px;}
.tr-name{font-size:12px;color:var(--muted);font-weight:800;}
.start-btn{background:linear-gradient(135deg,var(--red) 0%,var(--red2) 100%);color:white;border:none;border-radius:var(--r);padding:1rem 2.75rem;font-size:19px;font-weight:900;font-family:'Fredoka One',cursive;cursor:pointer;letter-spacing:1px;box-shadow:0 6px 0 #7a0000,0 0 24px rgba(204,0,0,0.35);transition:transform 0.1s,box-shadow 0.1s;}
.start-btn:active{transform:translateY(6px);box-shadow:0 0 0 #7a0000;}

/* HUD */
#game{display:none;}
.hud{display:flex;justify-content:space-between;align-items:center;gap:0.6rem;margin-bottom:0.8rem;}
.hc{background:var(--card);border-radius:var(--rs);padding:0.45rem 0.8rem;border:1px solid rgba(255,255,255,0.05);}
.hc-lbl{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px;}
.hc-val{font-size:18px;font-weight:900;color:var(--gold);font-family:'Fredoka One',cursive;}
.hearts{display:flex;gap:2px;font-size:16px;}
.prog-wrap{background:rgba(255,255,255,0.06);border-radius:999px;height:7px;margin-bottom:1rem;overflow:hidden;}
.prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width 0.55s cubic-bezier(.4,0,.2,1);}
.pdex-bar{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:var(--rs);padding:0.4rem 0.85rem;margin-bottom:0.85rem;border:1px solid rgba(255,215,0,0.1);font-size:12px;font-weight:800;color:var(--muted);min-height:44px;}
.pdex-bar b{color:var(--gold);}
.mini-pokes{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.mini-img{width:30px;height:30px;object-fit:contain;animation:popin 0.35s cubic-bezier(.4,0,.2,1) both;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));}
.mini-em{font-size:22px;animation:popin 0.35s cubic-bezier(.4,0,.2,1) both;}
@keyframes popin{0%{opacity:0;transform:scale(0) rotate(-20deg)}70%{transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

/* TYPE BADGE */
.type-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.85rem;}
.tb-listen{background:rgba(33,150,243,0.13);border:1.5px solid rgba(33,150,243,0.28);color:#64b5f6;}
.tb-vocab{background:rgba(156,39,176,0.13);border:1.5px solid rgba(156,39,176,0.28);color:#ce93d8;}
.tb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tb-listen .tb-dot{background:#64b5f6;box-shadow:0 0 6px #64b5f6;}
.tb-vocab .tb-dot{background:#ce93d8;box-shadow:0 0 6px #ce93d8;}

/* SCENE */
.scene{background:var(--card);border-radius:var(--r);border:1.5px solid rgba(255,255,255,0.06);padding:1rem;margin-bottom:0.85rem;display:flex;align-items:center;gap:1rem;min-height:120px;position:relative;overflow:hidden;}
.poke-wrap{flex-shrink:0;position:relative;z-index:2;width:100px;height:100px;display:flex;align-items:center;justify-content:center;}
.poke-wrap.caught::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--gold);animation:catchring 0.7s ease-out both;}
@keyframes catchring{0%{transform:scale(0.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.scene-img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,0.5));}
.scene-img.pop{animation:popbounce 0.5s;}
.scene-img.shake{animation:shakeanim 0.45s;}
.scene-em{font-size:64px;line-height:1;}
.scene-em.pop{animation:popbounce 0.5s;}
.scene-em.shake{animation:shakeanim 0.45s;}
@keyframes popbounce{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-18px) scale(1.1)}65%{transform:translateY(-5px) scale(0.96)}}
@keyframes shakeanim{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
@keyframes pokeenter{0%{opacity:0;transform:translateY(20px) scale(0.7)}60%{transform:translateY(-8px) scale(1.08)}100%{opacity:1;transform:translateY(0) scale(1)}}
.entering{animation:pokeenter 0.55s cubic-bezier(.4,0,.2,1) both;}
.scene-right{flex:1;position:relative;z-index:2;}
.trainer-lbl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.bubble{background:white;color:#1a1a2e;border-radius:12px 12px 12px 4px;padding:0.55rem 0.8rem;font-size:14px;font-weight:800;line-height:1.45;display:inline-block;max-width:230px;box-shadow:0 4px 14px rgba(0,0,0,0.35);}
.bubble-l{border-left:4px solid var(--blue);}
.bubble-v{border-left:4px solid var(--purple);}
.caught-lbl{position:absolute;bottom:0.6rem;right:0.85rem;font-size:11px;font-weight:800;color:var(--gold);opacity:0;transition:opacity 0.3s;}
.caught-lbl.show{opacity:1;}

/* AUDIO */
.audio-card{background:var(--card2);border-radius:var(--r);border:1.5px solid rgba(33,150,243,0.18);padding:1rem;margin-bottom:0.85rem;display:flex;flex-direction:column;align-items:center;gap:0.6rem;}
.wave{display:flex;align-items:center;gap:4px;height:34px;}
.wb{width:5px;border-radius:999px;background:rgba(33,150,243,0.22);}
.wb.on{background:var(--blue);animation:wp var(--h,.6s) ease-in-out infinite alternate;}
@keyframes wp{0%{transform:scaleY(0.25)}100%{transform:scaleY(1)}}
.audio-hint{font-size:13px;color:var(--muted);font-weight:700;}

/* PIC CARD */
.pic-card{background:var(--card2);border-radius:var(--r);border:1.5px solid rgba(255,255,255,0.06);padding:1.25rem 1rem 0.85rem;margin-bottom:0.85rem;text-align:center;}
.pic-emoji{font-size:88px;line-height:1;display:block;margin-bottom:0.35rem;}
.pic-lbl{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:2px;text-transform:uppercase;}

/* Q & OPTIONS */
.q-text{font-size:16px;font-weight:800;color:var(--text);text-align:center;margin-bottom:0.85rem;line-height:1.5;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.85rem;}
.opt{background:var(--card);border:2px solid rgba(255,255,255,0.08);border-radius:var(--rs);padding:0.75rem 0.5rem;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.16s;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:5px;}
.opt:hover:not(:disabled){border-color:rgba(255,215,0,0.5);transform:translateY(-2px);box-shadow:0 4px 16px rgba(255,215,0,0.15);}
.opt:active:not(:disabled){transform:scale(0.96);}
.opt-emoji{font-size:36px;line-height:1;}
.opt-word{font-size:15px;font-weight:800;}
.opt:disabled{cursor:default;transform:none!important;}
.opt.correct{background:var(--cbg);border-color:var(--correct);}
.opt.correct .opt-word{color:var(--correct);}
.opt.wrong{background:var(--wbg);border-color:var(--wrong);}
.opt.wrong .opt-word{color:var(--wrong);}

/* FEEDBACK */
.feedback{border-radius:var(--rs);padding:0.65rem 1rem;font-size:14px;font-weight:700;display:none;align-items:center;gap:8px;margin-bottom:0.85rem;}
.feedback.show{display:flex;}
.feedback.ok{background:var(--cbg);color:var(--correct);border:1px solid rgba(0,230,118,0.18);}
.feedback.no{background:var(--wbg);color:#ff8a80;border:1px solid rgba(255,82,82,0.18);}
.btns{display:flex;gap:0.6rem;}
.play-btn{display:flex;align-items:center;gap:6px;background:rgba(33,150,243,0.1);border:1.5px solid rgba(33,150,243,0.22);color:#64b5f6;border-radius:var(--rs);padding:0.6rem 0.9rem;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;white-space:nowrap;}
.next-btn{flex:1;background:linear-gradient(135deg,var(--red) 0%,var(--red2) 100%);color:white;border:none;border-radius:var(--rs);padding:0.6rem;font-size:15px;font-weight:900;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 4px 0 #7a0000;transition:transform 0.1s,box-shadow 0.1s;display:none;}
.next-btn:active{transform:translateY(4px);box-shadow:none;}
.next-btn.show{display:block;}

/* CATCH POPUP */
.overlay{position:fixed;inset:0;z-index:499;background:rgba(0,0,0,0.5);opacity:0;transition:opacity 0.3s;pointer-events:none;}
.overlay.show{opacity:1;}
.catch-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:500;background:var(--card);border:3px solid var(--gold);border-radius:24px;padding:1.5rem 2rem;text-align:center;box-shadow:0 0 60px rgba(255,215,0,0.3),0 20px 60px rgba(0,0,0,0.6);transition:transform 0.3s cubic-bezier(.4,0,.2,1),opacity 0.3s;opacity:0;pointer-events:none;min-width:220px;}
.catch-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
.popup-ball{font-size:28px;margin-bottom:0.5rem;}
.popup-img{width:130px;height:130px;object-fit:contain;display:block;margin:0 auto 0.5rem;animation:catchpop 0.5s cubic-bezier(.4,0,.2,1) 0.1s both;filter:drop-shadow(0 6px 20px rgba(255,215,0,0.4));}
.popup-em{font-size:90px;line-height:1;display:block;margin:0 auto 0.5rem;animation:catchpop 0.5s cubic-bezier(.4,0,.2,1) 0.1s both;}
@keyframes catchpop{0%{opacity:0;transform:scale(0.4) rotate(-10deg)}65%{transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.popup-name{font-family:'Fredoka One',cursive;font-size:22px;color:var(--gold);margin-bottom:0.15rem;}
.popup-zh{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:0.5rem;}
.popup-tag{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;color:var(--gold);}

/* END */
#end{display:none;}
#end.show{display:block;}
.end-card{background:var(--card);border-radius:var(--r);border:2px solid rgba(255,215,0,0.22);box-shadow:0 0 40px rgba(255,215,0,0.1),0 20px 60px rgba(0,0,0,0.5);padding:2rem 1.5rem;text-align:center;}
.end-trophy{font-size:72px;line-height:1;margin-bottom:0.25rem;}
.end-title{font-family:'Fredoka One',cursive;font-size:26px;background:linear-gradient(135deg,var(--gold),var(--red2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.2rem;}
.end-score{font-family:'Fredoka One',cursive;font-size:46px;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.4);margin:0.2rem 0;}
.end-breakdown{display:flex;justify-content:center;gap:0.65rem;flex-wrap:wrap;margin:0.65rem 0 0.9rem;}
.bk{background:var(--card2);border-radius:var(--rs);padding:0.4rem 0.85rem;font-size:12px;font-weight:700;color:var(--muted);}
.bk b{color:var(--text);}
.caught-section{margin:0.75rem 0 1rem;}
.caught-ttl{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:0.65rem;}
.caught-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:0.5rem;}
.caught-card{background:var(--card2);border-radius:12px;border:1.5px solid rgba(255,215,0,0.15);padding:0.5rem;text-align:center;width:82px;animation:cardpop 0.4s cubic-bezier(.4,0,.2,1) both;}
@keyframes cardpop{0%{opacity:0;transform:scale(0.5)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
.caught-card-img{width:62px;height:62px;object-fit:contain;display:block;margin:0 auto 3px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));}
.caught-card-em{font-size:44px;line-height:1;display:block;margin:0 auto 3px;}
.caught-card-name{font-size:10px;color:var(--muted);font-weight:800;}
.end-stars{font-size:30px;letter-spacing:5px;margin:0.35rem 0 0.6rem;}
.sp{display:inline-block;animation:starpop 0.5s cubic-bezier(.4,0,.2,1) both;}
.sp:nth-child(2){animation-delay:.13s;}.sp:nth-child(3){animation-delay:.26s;}
@keyframes starpop{0%{opacity:0;transform:scale(0.3) rotate(-30deg)}65%{transform:scale(1.3) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.end-msg{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:1.25rem;}
.end-btns{display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;}
.eb{padding:0.75rem 1.5rem;border-radius:var(--rs);border:none;font-family:'Fredoka One',cursive;font-size:15px;cursor:pointer;letter-spacing:0.5px;transition:transform 0.1s,box-shadow 0.1s;}
.eb-p{background:linear-gradient(135deg,var(--red),var(--red2));color:white;box-shadow:0 4px 0 #7a0000;}
.eb-p:active{transform:translateY(4px);box-shadow:none;}
.eb-s{background:var(--card2);color:var(--muted);border:1.5px solid rgba(255,255,255,0.07);box-shadow:0 4px 0 rgba(0,0,0,0.3);}
.eb-s:active{transform:translateY(4px);box-shadow:none;}
</style>
</head>
<body>
<div id="stars"></div>
<div id="confetti"></div>
<div class="overlay" id="overlay"></div>
<div class="catch-popup" id="catch-popup">
  <div class="popup-ball">🔴</div>
  <div id="popup-art"></div>
  <div class="popup-name" id="popup-name"></div>
  <div class="popup-zh" id="popup-zh"></div>
  <div class="popup-tag">✨ 捕獲成功！</div>
</div>

<div id="app">
  <div id="loading">
    <div class="pb-spin"></div>
    <div class="ld-title">寶可夢出沒中…</div>
    <div class="ld-sub">正在準備冒險，請稍候！</div>
  </div>

  <div id="start">
    <div class="logo-pb"></div>
    <div class="title">寶可夢英文大冒險</div>
    <div class="subtitle">ILTEA · Pokémon Edition</div>
    <div class="chips">
      <div class="chip">🎯 <b>20題</b> 綜合</div>
      <div class="chip">🔊 聽力 + 📖 單字</div>
      <div class="chip">⭐ 適合 <b>6歲</b>+</div>
      <div class="chip">🎮 答對捕獲寶可夢</div>
    </div>
    <div class="tr-label">選擇你的訓練師！</div>
    <div class="tr-row" id="tr-row"></div>
    <button class="start-btn" onclick="startGame()">⚡ 開始冒險！⚡</button>
  </div>

  <div id="game">
    <div class="hud">
      <div class="hc"><div class="hc-lbl">分數</div><div class="hc-val" id="score-disp">0</div></div>
      <div class="hc" style="flex:1;text-align:center"><div class="hc-lbl">題目</div><div class="hc-val"><span id="q-num">1</span><span style="color:var(--muted);font-size:13px"> /20</span></div></div>
      <div class="hc"><div class="hearts" id="hearts">❤️❤️❤️</div></div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <div class="pdex-bar">🏆 捕獲：<b id="caught-count">0</b> 隻 <div class="mini-pokes" id="mini-pokes"></div></div>
    <div id="type-badge" class="type-badge tb-listen"><div class="tb-dot"></div><span id="badge-txt">聽力題</span></div>
    <div class="scene">
      <div class="poke-wrap" id="poke-wrap"></div>
      <div style="flex:1;position:relative;z-index:2;">
        <div class="trainer-lbl" id="trainer-lbl">小智說：</div>
        <div class="bubble" id="bubble">準備好了嗎？</div>
      </div>
      <div class="caught-lbl" id="caught-lbl"></div>
    </div>
    <div class="audio-card" id="audio-card" style="display:none">
      <div class="wave">
        <div class="wb" style="height:9px;--h:.5s"></div><div class="wb" style="height:25px;--h:.7s"></div>
        <div class="wb" style="height:17px;--h:.6s"></div><div class="wb" style="height:33px;--h:.8s"></div>
        <div class="wb" style="height:21px;--h:.65s"></div><div class="wb" style="height:29px;--h:.75s"></div>
        <div class="wb" style="height:15px;--h:.55s"></div><div class="wb" style="height:25px;--h:.7s"></div>
        <div class="wb" style="height:11px;--h:.5s"></div>
      </div>
      <div class="audio-hint">👂 仔細聽，選出你聽到的單字！</div>
    </div>
    <div class="pic-card" id="pic-card" style="display:none">
      <span class="pic-emoji" id="pic-emoji"></span>
      <div class="pic-lbl">這是什麼？選出英文單字！</div>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btns">
      <button class="play-btn" id="play-btn" onclick="playAudio()">🔊 再聽一次</button>
      <button class="next-btn" id="next-btn" onclick="nextQ()">下一題 ➜</button>
    </div>
  </div>

  <div id="end">
    <div class="end-card">
      <div class="end-trophy" id="end-trophy">🏆</div>
      <div class="end-title" id="end-title">冒險完成！</div>
      <div class="end-score" id="end-score">0</div>
      <div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:0.4rem">/ 200 分</div>
      <div class="end-breakdown">
        <div class="bk">🔊 聽力：<b id="ls">0</b>分</div>
        <div class="bk">📖 單字：<b id="vs">0</b>分</div>
        <div class="bk">❤️ 剩餘：<b id="hl">0</b>顆</div>
      </div>
      <div class="caught-section">
        <div class="caught-ttl">✨ 你這局捕獲的寶可夢</div>
        <div class="caught-grid" id="caught-grid"></div>
      </div>
      <div class="end-stars" id="end-stars"></div>
      <div class="end-msg" id="end-msg"></div>
      <div class="end-btns">
        <button class="eb eb-p" onclick="restartGame()">⚡ 再挑戰</button>
        <button class="eb eb-s" onclick="goHome()">🏠 首頁</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 補上遺失的圖片來源定義 =====
function SPRITE(id) {
  // PokeAPI 點陣圖網址
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
}

function ART(id) {
  // PokeAPI 高清官方繪圖網址
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
}

// ===== HELPER: 建立含圖片的寶可夢 HTML 節點 =====
function pokeImg(src, alt, emoji, className, size) {
  const container = document.createElement("div");
  container.className = className;
  container.style.cssText = `width:${size}px;height:${size}px;position:relative;display:flex;align-items:center;justify-content:center;`;

  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  img.style.cssText = `width:100%;height:100%;object-fit:contain;position:absolute;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4));`;
  
  // 萬一網路圖檔加載失敗的後備 Emoji 機制
  img.onerror = function() {
    img.style.display = "none";
    const em = document.createElement("span");
    em.textContent = emoji;
    em.style.fontSize = `${Math.round(size * 0.65)}px`;
    container.appendChild(em);
  };

  container.appendChild(img);
  return container;
}

// ===== POKEMON LIST =====
const POKES = [
  {id:25,  name:"Pikachu",    zh:"皮卡丘",  em:"⚡"},
  {id:4,   name:"Charmander", zh:"小火龍",  em:"🔥"},
  {id:7,   name:"Squirtle",   zh:"傑尼龜",  em:"💧"},
  {id:1,   name:"Bulbasaur",  zh:"妙蛙種子",em:"🌿"},
  {id:39,  name:"Jigglypuff", zh:"胖丁",    em:"🎵"},
  {id:52,  name:"Meowth",     zh:"喵喵",    em:"🐱"},
  {id:54,  name:"Psyduck",    zh:"可達鴨",  em:"🦆"},
  {id:94,  name:"Gengar",     zh:"耿鬼",    em:"👻"},
  {id:143, name:"Snorlax",    zh:"卡比獸",  em:"😴"},
  {id:133, name:"Eevee",      zh:"伊貝",    em:"🦊"},
  {id:129, name:"Magikarp",   zh:"鯉魚王",  em:"🐟"},
  {id:150, name:"Mewtwo",     zh:"超夢",    em:"🧬"},
  {id:58,  name:"Growlithe",  zh:"卡蒂狗",  em:"🐶"},
  {id:43,  name:"Oddish",     zh:"走路草",  em:"🌱"},
  {id:37,  name:"Vulpix",     zh:"六尾",    em:"🦊"},
  {id:63,  name:"Abra",       zh:"凱西",    em:"🔮"},
  {id:79,  name:"Slowpoke",   zh:"呆呆獸",  em:"🐢"},
  {id:74,  name:"Geodude",    zh:"小拳石",  em:"🪨"},
  {id:92,  name:"Gastly",     zh:"鬼斯",    em:"💨"},
  {id:19,  name:"Rattata",    zh:"小拉達",  em:"🐭"},
];

const TRAINERS = [
  {name:"小智", poke:0,  say:["What do you hear?","Listen carefully!","You can do it!","Which one?","Go!"]},
  {name:"小霞", poke:2,  say:["Find the word!","Which one?","Try your best!","Yeah!","You know this!"]},
  {name:"小剛", poke:16, say:["Look carefully!","Choose wisely!","Take your time!","Great!","Let's go!"]}, // 原17號超出陣列，修回呆呆獸
];

// ===== QUESTIONS =====
const LISTEN_QS = [
  {type:"listen",audio:"elephant",q:"選出你聽到的動物！",opts:[{e:"🐘",w:"elephant"},{e:"🦁",w:"lion"},{e:"🐊",w:"crocodile"},{e:"🦒",w:"giraffe"}],ans:"elephant"},
  {type:"listen",audio:"hamburger",q:"選出你聽到的食物！",opts:[{e:"🍔",w:"hamburger"},{e:"🍕",w:"pizza"},{e:"🌮",w:"taco"},{e:"🍜",w:"noodles"}],ans:"hamburger"},
  {type:"listen",audio:"purple",q:"選出你聽到的顏色！",opts:[{e:"🟣",w:"purple"},{e:"🔴",w:"red"},{e:"🔵",w:"blue"},{e:"🟤",w:"brown"}],ans:"purple"},
  {type:"listen",audio:"ten",q:"選出你聽到的數字！",opts:[{e:"7️⃣",w:"seven"},{e:"8️⃣",w:"eight"},{e:"9️⃣",w:"nine"},{e:"🔟",w:"ten"}],ans:"ten"},
  {type:"listen",audio:"triangle",q:"選出你聽到的形狀！",opts:[{e:"⭕",w:"circle"},{e:"🔺",w:"triangle"},{e:"🟦",w:"square"},{e:"💎",w:"diamond"}],ans:"triangle"},
  {type:"listen",audio:"nose",q:"選出你聽到的身體部位！",opts:[{e:"👁️",w:"eye"},{e:"👂",w:"ear"},{e:"👃",w:"nose"},{e:"👄",w:"mouth"}],ans:"nose"},
  {type:"listen",audio:"hat",q:"選出你聽到的衣物！",opts:[{e:"👒",w:"hat"},{e:"👟",w:"shoes"},{e:"🧤",w:"gloves"},{e:"🧣",w:"scarf"}],ans:"hat"},
  {type:"listen",audio:"table",q:"選出你聽到的家具！",opts:[{e:"🛋️",w:"sofa"},{e:"🪑",w:"chair"},{e:"🛏️",w:"bed"},{e:"🪞",w:"table"}],ans:"table"},
  {type:"listen",audio:"sunny",q:"選出你聽到的天氣！",opts:[{e:"☀️",w:"sunny"},{e:"🌧️",w:"rainy"},{e:"❄️",w:"snowy"},{e:"🌩️",w:"stormy"}],ans:"sunny"},
  {type:"listen",audio:"bicycle",q:"選出你聽到的交通工具！",opts:[{e:"🚗",w:"car"},{e:"🚲",w:"bicycle"},{e:"✈️",w:"airplane"},{e:"🚢",w:"ship"}],ans:"bicycle"},
];
const VOCAB_QS = [
  {type:"vocab",emoji:"🦊",q:"選出正確的英文單字！",opts:[{e:"🦊",w:"fox"},{e:"🐺",w:"wolf"},{e:"🦝",w:"raccoon"},{e:"🐱",w:"cat"}],ans:"fox"},
  {type:"vocab",emoji:"🍣",q:"選出正確的英文單字！",opts:[{e:"🍣",w:"sushi"},{e:"🍜",w:"noodles"},{e:"🍱",w:"bento"},{e:"🥟",w:"dumpling"}],ans:"sushi"},
  {type:"vocab",emoji:"🟠",q:"選出正確的英文單字！",opts:[{e:"🟡",w:"yellow"},{e:"🟠",w:"orange"},{e:"🔴",w:"red"},{e:"🟤",w:"brown"}],ans:"orange"},
  {type:"vocab",emoji:"6️⃣",q:"選出正確的英文單字！",opts:[{e:"4️⃣",w:"four"},{e:"5️⃣",w:"five"},{e:"6️⃣",w:"six"},{e:"7️⃣",w:"seven"}],ans:"six"},
  {type:"vocab",emoji:"⭐",q:"選出正確的英文單字！",opts:[{e:"⭐",w:"star"},{e:"❤️",w:"heart"},{e:"🔶",w:"diamond"},{e:"⭕",w:"circle"}],ans:"star"},
  {type:"vocab",emoji:"🦷",q:"選出正確的英文單字！",opts:[{e:"🦷",w:"tooth"},{e:"💅",w:"nail"},{e:"👅",w:"tongue"},{e:"🦴",w:"bone"}],ans:"tooth"},
  {type:"vocab",emoji:"👗",q:"選出正確的英文單字！",opts:[{e:"👗",w:"dress"},{e:"👕",w:"shirt"},{e:"👖",w:"pants"},{e:"🧥",w:"coat"}],ans:"dress"},
  {type:"vocab",emoji:"🛏️",q:"選出正確的英文單字！",opts:[{e:"🛏️",w:"bed"},{e:"🛁",w:"bathtub"},{e:"🚪",w:"door"},{e:"🪟",w:"window"}],ans:"bed"},
  {type:"vocab",emoji:"🌈",q:"選出正確的英文單字！",opts:[{e:"🌈",w:"rainbow"},{e:"⛅",w:"cloudy"},{e:"🌪️",w:"windy"},{e:"🌫️",w:"foggy"}],ans:"rainbow"},
  {type:"vocab",emoji:"🚁",q:"選出正確的英文單字！",opts:[{e:"🚁",w:"helicopter"},{e:"🚀",w:"rocket"},{e:"🛸",w:"UFO"},{e:"🛩️",w:"jet"}],ans:"helicopter"},
];

// ===== STATE =====
let trainerIdx=0, questions=[], current=0, score=0, hearts=3, answered=false;
let listenScore=0, vocabScore=0, caught=[], pokeIdx=0, shuffled=[];

// ===== STARS =====
(function(){
  const c=document.getElementById("stars");
  for(let i=0;i<60;i++){
    const s=document.createElement("div"); s.className="star";
    const sz=Math.random()*2.5+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*5}s`;
    c.appendChild(s);
  }
})();

// ===== INIT =====
function init(){
  const row=document.getElementById("tr-row");
  TRAINERS.forEach((t,i)=>{
    const p=POKES[t.poke];
    const btn=document.createElement("button");
    btn.className="tr-btn"+(i===0?" sel":"");
    btn.onclick=()=>{ document.querySelectorAll(".tr-btn").forEach(b=>b.classList.remove("sel")); btn.classList.add("sel"); trainerIdx=i; };
    const img = pokeImg(SPRITE(p.id), p.zh, p.em, "tr-img", 64);
    const nm=document.createElement("div"); nm.className="tr-name"; nm.textContent=t.name;
    btn.appendChild(img); btn.appendChild(nm); row.appendChild(btn);
  });
  setTimeout(()=>{ document.getElementById("loading").style.display="none"; document.getElementById("start").style.display="block"; }, 800);
}

// ===== SCENE POKEMON =====
function showScene(poke, entering){
  const wrap=document.getElementById("poke-wrap");
  wrap.innerHTML=""; wrap.classList.remove("caught");
  const img = pokeImg(SPRITE(poke.id), poke.zh, poke.em, "scene-img"+(entering?" entering":""), 96);
  wrap.appendChild(img);
  document.getElementById("bubble").textContent=`野生的${poke.zh}出現了！`;
  setTimeout(()=>{
    const t=TRAINERS[trainerIdx];
    document.getElementById("bubble").textContent=t.say[current%t.say.length];
  }, 1400);
}

function animScene(type){
  const el=document.querySelector(".scene-img img, .scene-em");
  if(!el) return;
  el.classList.remove("pop","shake"); void el.offsetWidth; el.classList.add(type);
}

// ===== CATCH POPUP =====
function showPopup(poke){
  document.getElementById("popup-name").textContent=poke.name;
  document.getElementById("popup-zh").textContent=poke.zh;
  const art=document.getElementById("popup-art");
  art.innerHTML="";
  const img = pokeImg(ART(poke.id), poke.zh, poke.em, "popup-img", 130);
  art.appendChild(img);
  document.getElementById("catch-popup").classList.add("show");
  document.getElementById("overlay").classList.add("show");
  setTimeout(()=>{
    document.getElementById("catch-popup").classList.remove("show");
    document.getElementById("overlay").classList.remove("show");
  }, 1800);
}

// ===== START =====
function startGame(){
  const lqs=[...LISTEN_QS].sort(()=>Math.random()-0.5);
  const vqs=[...VOCAB_QS].sort(()=>Math.random()-0.5);
  questions=[...lqs,...vqs].sort(()=>Math.random()-0.5);
  current=0; score=0; hearts=3; answered=false;
  listenScore=0; vocabScore=0; caught=[]; pokeIdx=0;
  shuffled=[...POKES].sort(()=>Math.random()-0.5);
  const si=TRAINERS[trainerIdx].poke;
  const starter=POKES[si];
  shuffled=shuffled.filter(p=>p.id!==starter.id);
  shuffled.unshift(starter);

  document.getElementById("start").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("end").className="";
  document.getElementById("mini-pokes").innerHTML="";
  document.getElementById("caught-count").textContent="0";
  updateHearts();
  showScene(shuffled[0], false);
  renderQ();
}

// ===== RENDER =====
function renderQ(){
  const q=questions[current]; const t=TRAINERS[trainerIdx];
  answered=false;
  document.getElementById("q-num").textContent=current+1;
  document.getElementById("prog").style.width=(current/questions.length*100)+"%";
  const badge=document.getElementById("type-badge");
  if(q.type==="listen"){ badge.className="type-badge tb-listen"; document.getElementById("badge-txt").textContent="🎧 聽力題"; }
  else{ badge.className="type-badge tb-vocab"; document.getElementById("badge-txt").textContent="📖 單字題"; }
  document.getElementById("trainer-lbl").textContent=t.name+"說：";
  document.getElementById("bubble").className="bubble "+(q.type==="listen"?"bubble-l":"bubble-v");
  document.getElementById("bubble").textContent=t.say[current%t.say.length];
  document.getElementById("caught-lbl").classList.remove("show");
  if(q.type==="listen"){
    document.getElementById("audio-card").style.display="flex";
    document.getElementById("pic-card").style.display="none";
    document.getElementById("play-btn").style.display="flex";
    stopWave();
  } else {
    document.getElementById("audio-card").style.display="none";
    document.getElementById("pic-card").style.display="block";
    document.getElementById("pic-emoji").textContent=q.emoji;
    document.getElementById("play-btn").style.display="none";
  }
  document.getElementById("q-text").textContent=q.q;
  const opts=[...q.opts].sort(()=>Math.random()-0.5);
  const grid=document.getElementById("opts"); grid.innerHTML="";
  opts.forEach(o=>{
    const btn=document.createElement("button"); btn.className="opt";
    btn.innerHTML=`<span class="opt-emoji">${o.e}</span><span class="opt-word">${o.w}</span>`;
    btn.onclick=()=>choose(o.w,q.ans,q.type);
    grid.appendChild(btn);
  });
  document.getElementById("feedback").className="feedback";
  document.getElementById("next-btn").className="next-btn";
  if(q.type==="listen") setTimeout(()=>playAudio(),600);
}

// ===== AUDIO =====
function playAudio(){
  const q=questions[current]; if(q.type!=="listen") return;
  if("speechSynthesis" in window){ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(q.audio); u.lang="en-US"; u.rate=0.78; u.pitch=1.1; window.speechSynthesis.speak(u); }
  animWave(); animScene("pop");
}
function animWave(){ document.querySelectorAll(".wb").forEach(b=>b.classList.add("on")); setTimeout(()=>document.querySelectorAll(".wb").forEach(b=>b.classList.remove("on")),1200); }
function stopWave(){ document.querySelectorAll(".wb").forEach(b=>b.classList.remove("on")); }

// ===== CHOOSE =====
function choose(chosen, ans, qtype){
  if(answered) return; answered=true;
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; const w=b.querySelector(".opt-word").textContent; if(w===ans) b.classList.add("correct"); if(w===chosen&&chosen!==ans) b.classList.add("wrong"); });
  const fb=document.getElementById("feedback");
  if(chosen===ans){
    score+=10; if(qtype==="listen") listenScore+=10; else vocabScore+=10;
    document.getElementById("score-disp").textContent=score;
    fb.innerHTML=`🎉 答對了！<b>${ans}</b> 太棒了！`; fb.className="feedback show ok";
    if("speechSynthesis" in window){ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(ans); u.lang="en-US"; u.rate=0.85; u.pitch=1.1; window.speechSynthesis.speak(u); }
    catchPoke();
  } else {
    hearts=Math.max(0,hearts-1); updateHearts();
    fb.innerHTML=`💪 正確答案是：<b>${ans}</b>！`; fb.className="feedback show no";
    animScene("shake"); document.getElementById("bubble").textContent="Try again! 💪";
  }
  document.getElementById("next-btn").className="next-btn show";
}

// ===== CATCH =====
function catchPoke(){
  const p=shuffled[pokeIdx]; caught.push(p);
  const wrap=document.getElementById("poke-wrap");
  wrap.classList.remove("caught"); void wrap.offsetWidth; wrap.classList.add("caught");
  const lbl=document.getElementById("caught-lbl"); lbl.textContent=`✨ ${p.zh} 捕獲！`; lbl.classList.add("show");
  document.getElementById("bubble").textContent=`${p.zh} 加入隊伍！`;
  animScene("pop");
  const mini=document.getElementById("mini-pokes");
  const img = pokeImg(ART(p.id), p.zh, p.em, "mini-img", 30);
  img.title=p.zh; mini.appendChild(img);
  document.getElementById("caught-count").textContent=caught.length;
  showPopup(p);
  pokeIdx=(pokeIdx+1)%shuffled.length;
}

// ===== NEXT =====
function nextQ(){
  current++;
  if(current>={questions}.length || hearts<=0){ showEnd(); return; } // 當血量歸零也觸發結束
  showScene(shuffled[pokeIdx], true);
  renderQ();
}

function updateHearts(){
  const h=document.getElementById("hearts"); h.innerHTML="";
  for(let i=0;i<3;i++){ const s=document.createElement("span"); s.textContent=i<hearts?"❤️":"🖤"; h.appendChild(s); }
}

// ===== END =====
function showEnd(){
  document.getElementById("prog").style.width="100%";
  document.getElementById("game").style.display="none";
  document.getElementById("end").className="show";
  document.getElementById("ls").textContent=listenScore;
  document.getElementById("vs").textContent=vocabScore;
  document.getElementById("hl").textContent=hearts;
  document.getElementById("end-score").textContent=score;
  const pct=score/200;
  let trophy,title,msg,stars;
  if(pct>0.9){trophy="🌟";title="英文大師！";msg="你捕獲了所有寶可夢！完美冒險！";stars=3;}
  else if(pct>=0.7){trophy="🏆";title="超級厲害！";msg="皮卡丘為你驕傲！繼續加油！";stars=3;}
  else if(pct>=0.5){trophy="🏅";title="做得很好！";msg="再練習幾次就能成為冠軍！";stars=2;}
  else{trophy="💪";title="繼續冒險！";msg="每次練習都是進步，不要放棄！";stars=1;}
  document.getElementById("end-trophy").textContent=trophy;
  document.getElementById("end-title").textContent=title;
  document.getElementById("end-msg").textContent=msg;
  const grid=document.getElementById("caught-grid"); grid.innerHTML="";
  if(caught.length===0){
    grid.innerHTML='<span style="color:var(--muted);font-size:13px;padding:0.5rem">答對才能捕獲寶可夢喔！</span>';
  } else {
    caught.forEach((p,i)=>{
      const card=document.createElement("div"); card.className="caught-card"; card.style.animationDelay=(i*0.07)+"s";
      const img = pokeImg(ART(p.id), p.zh, p.em, "caught-card-img", 62);
      const nm=document.createElement("div"); nm.className="caught-card-name"; nm.textContent=p.zh;
      card.appendChild(img); card.appendChild(nm); grid.appendChild(card);
    });
  }
  const stEl=document.getElementById("end-stars"); stEl.innerHTML="";
  for(let i=0;i<3;i++){ const s=document.createElement("span"); s.className="sp"; s.style.animationDelay=(i*0.15)+"s"; s.textContent=i<stars?"⭐":"☆"; stEl.appendChild(s); }
  if(pct>=0.7) spawnConfetti();
}

function spawnConfetti(){
  const cols=["#FFD700","#CC0000","#00e676","#64b5f6","#ce93d8","#ff8a65"];
  const wrap=document.getElementById("confetti"); wrap.innerHTML="";
  for(let i=0;i<80;i++){
    const d=document.createElement("div"); d.className="cp";
    const c=cols[Math.floor(Math.random()*cols.length)], sz=5+Math.random()*9;
    d.style.cssText=`left:${Math.random()*100}%;background:${c};--dur:${1.5+Math.random()*2}s;--dl:${Math.random()*1.5}s;width:${sz}px;height:${sz}px;border-radius:${Math.random()>.5?"50%":"3px"}`;
    wrap.appendChild(d);
  }
  setTimeout(()=>wrap.innerHTML="",5000);
}

function restartGame(){ document.getElementById("end").className=""; startGame(); }
function goHome(){ document.getElementById("end").className=""; document.getElementById("game").style.display="none"; document.getElementById("start").style.display="block"; }

init();
</script>
</body>
</html>
